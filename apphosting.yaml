# apphosting.yaml
# Optional: set REVALIDATE_SECRET in App Hosting console (same value as local
# .env) so localhost admin can bust production via POST /api/revalidate.
runConfig:
  maxInstances: 1

environmentVariables:
  - name: NPM_CONFIG_LEGACY_PEER_DEPS
    value: "true"
  - name: NEXT_PUBLIC_GTM_ID
    value: "GTM-WBW36JRV"
  - name: NEXT_PUBLIC_GA_ID
    value: "G-4LXVB7FZW8"
